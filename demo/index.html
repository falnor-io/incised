<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>incised</title>
    <style>
      :root { color-scheme: light dark; --background: #fbfaf7; --foreground: #16181d; --muted-foreground: #5d6470; --border: #e3e5ea; --primary: #1d232b; }
      @media (prefers-color-scheme: dark) { :root { --background: #12161b; --foreground: #eceae4; --muted-foreground: #9aa1ab; --border: #2a313a; --primary: #e7b65c; } }
      body { margin: 0; background: var(--background); color: var(--foreground); font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 860px; margin: 0 auto; padding: 32px 16px 80px; }
      h1 { font-size: 28px; margin: 0 0 4px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-foreground); margin: 40px 0 12px; }
      .lede { color: var(--muted-foreground); margin: 0 0 24px; }
      .stack { display: grid; gap: 12px; }
      .two { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
      button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: inherit; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
      @media (max-width: 480px) { .ic-lane, .ic-compare { grid-template-columns: 1fr !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
