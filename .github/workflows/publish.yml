name: publish
# Release flow: run `npm run release -- patch` locally. That tags the commit and pushes the tag, this workflow
# checks it and STAGES the package (no token, no code prompt), and you approve it on npmjs.com with your security key.
# One-time setup, after the first release exists: npmjs.com, package orlune, Settings, Trusted Publisher: GitHub,
# organization falnor-io, repository orlune, workflow filename publish.yml, and allow only "npm stage publish".
# See docs/RELEASING.md.
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The tag must match the package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run check
      - run: npm run build
      - run: npm run smoke:pack
      - run: npm run smoke:next
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
  stage:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Stage the package, then approve it on npmjs.com
        run: npm stage publish --access public --ignore-scripts
